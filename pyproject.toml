[project]
name = "kostats"
version = "0.1.0"
description = "Local KOReader reading statistics dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.159.1",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
    "python-multipart>=0.0.32",
    "rich>=14.0.0",
    "uvicorn[standard]>=0.34.0",
]

[project.scripts]
dev = "backend.app.dev:main"
build-frontend = "backend.app.build:main"
prod = "backend.app.prod:main"

[build-system]
requires = ["setuptools>=80.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
